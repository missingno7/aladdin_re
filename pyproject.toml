[build-system]
requires = ["scikit-build-core==1.0.3"]
build-backend = "scikit_build_core.build"

[project]
name = "aladdin-sega"
version = "0.2.1"
description = "Inspectable, deterministic Aladdin Genesis development environment"
requires-python = ">=3.12"

[project.optional-dependencies]
play = ["pygame==2.6.1"]
test = ["pytest==9.1.1"]

[project.scripts]
aladdin-sega = "aladdin_sega.cli:main"

[tool.scikit-build]
wheel.packages = ["src/aladdin_sega"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
